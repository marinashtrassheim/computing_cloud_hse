stages:
  - build
  - deploy

variables:
  YC_REGISTRY_ID: "crpemh7fg1uk4n6bfgje"
  IMAGE_NAME: "hello-world"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - common
    - cpu
    - dind
    - amd64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p ~/.docker
    - echo '{"auths":{"cr.yandex":{"auth":"'$(echo -n "iam:$YC_IAM_TOKEN" | base64)'"}}}' > ~/.docker/config.json
    - cd src
    - docker build --platform linux/amd64 --build-arg app_version=$CI_COMMIT_TAG -t cr.yandex/$YC_REGISTRY_ID/$IMAGE_NAME:$CI_COMMIT_TAG .
    - docker push cr.yandex/$YC_REGISTRY_ID/$IMAGE_NAME:$CI_COMMIT_TAG

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - common
    - cpu
    - amd64
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  before_script:
    - apk add --no-cache python3 py3-pip openssh-client
    - pip3 install ansible
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - cd src/ansible
    - ansible-playbook playbook.yml --extra-vars "app_version=$CI_COMMIT_TAG yc_oauth_token=$YC_OAUTH_TOKEN"