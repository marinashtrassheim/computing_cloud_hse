stages:
  - build
  - deploy

variables:
  YC_REGISTRY_ID: "crpemh7fg1uk4n6bfgje"
  IMAGE_NAME: "hello-world"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - common
    - cpu
    - dind
    - amd64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p ~/.docker
    - echo '$YC_SERVICE_ACCOUNT_KEY' > /tmp/sa-key.json
    - echo '{"credHelpers": {"cr.yandex": "yc"}}' > ~/.docker/config.json
    - mkdir -p ~/.config/yandex-cloud
    - echo 'current:' > ~/.config/yandex-cloud/config.yaml
    - echo '  service-account-key-file: /tmp/sa-key.json' >> ~/.config/yandex-cloud/config.yaml
    - echo '  cloud-id: b1gjdm52o11vr2uc8v4f' >> ~/.config/yandex-cloud/config.yaml
    - echo '  folder-id: b1g79op71q1gsi6djitg' >> ~/.config/yandex-cloud/config.yaml
    - cd src
    - docker build --build-arg app_version=$CI_COMMIT_TAG -t cr.yandex/$YC_REGISTRY_ID/$IMAGE_NAME:$CI_COMMIT_TAG .
    - docker push cr.yandex/$YC_REGISTRY_ID/$IMAGE_NAME:$CI_COMMIT_TAG

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - common
    - cpu
    - amd64
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  before_script:
    - apk add --no-cache python3 py3-pip openssh-client
    - pip3 install ansible
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - cd src/ansible
    - ansible-playbook playbook.yml --extra-vars "app_version=$CI_COMMIT_TAG yc_oauth_token=$YC_OAUTH_TOKEN"
